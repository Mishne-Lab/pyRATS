name: Performance Benchmark

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    name: RATS Benchmark (${{ matrix.os }}, ${{ matrix.ref_name }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ref: ["${{ github.sha }}", "994b4e42af01e3ecada86a7abfdd2c0e59729533"]
        include:
          - ref: "${{ github.sha }}"
            ref_name: "Current HEAD"
          - ref: "994b4e42af01e3ecada86a7abfdd2c0e59729533"
            ref_name: "994b4e4 (Dhruv Optimized MT)"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Overlay Latest Benchmark Script
        run: |
          git fetch origin ${{ github.sha }} --depth=1
          git checkout FETCH_HEAD -- tests/scripts/benchmark.py

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[test]

      - name: Run Benchmark
        run: |
          echo "## RATS Performance Benchmarks (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ matrix.ref_name }} (${{ matrix.ref }})" >> $GITHUB_STEP_SUMMARY
          echo "Dataset: Klein Bottle (4D)" >> $GITHUB_STEP_SUMMARY
          python tests/scripts/benchmark.py >> $GITHUB_STEP_SUMMARY
