name: CI

on:
  push:
    branches: [ unit_testing_v1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Step 1: Checkout the known-good commit to generate expected baselines
    - name: Checkout Known-Good Commit
      uses: actions/checkout@v4
      with:
        ref: 8e27b77
    - name: Install Dependencies for Baseline
      run: |
        pip install --upgrade pip
        pip install -e .[test]
    - name: Generate Expected Baselines
      run: |
        python tests/scripts/generate_snapshots.py --path-to-results-dir tests/data/expected --fast-mode
    - name: Store Baselines Temporarily
      run: |
        mv tests/data/expected ${{ runner.temp }}/expected_baselines

    # Step 2: Checkout the current code testing branch (CLEAN)
    - name: Checkout Current Code
      uses: actions/checkout@v4
    
    - name: Restore Expected Baselines
      run: |
        mkdir -p tests/data
        mv ${{ runner.temp }}/expected_baselines tests/data/expected

    - name: Install Current Dependencies
      run: |
        pip install --upgrade pip
        pip install -e .[test]
    - name: Generate Actual Results
      run: python tests/scripts/generate_snapshots.py --path-to-results-dir tests/data/actual --fast-mode

    # Step 3: Pytest E2E Snapshot Assertions
    - name: Run Pytest Comparison
      run: pytest tests/test_e2e.py
