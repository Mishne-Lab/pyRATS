name: CI

on:
  push:
    branches: [ unit_testing_v1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Step 1: Checkout the current codebase
    - name: Checkout Current Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -e .[test]

    # Step 2: Generate Expected Baselines (using baseline source code but current scripts)
    - name: Generate Expected Baselines
      run: |
        git checkout 8e27b77b3247e1ac7447e7ea429e0f0c103a3fb0 -- src/
        python tests/scripts/generate_snapshots.py --path-to-results-dir tests/data/expected --fast-mode
        git checkout HEAD -- src/

    # Step 3: Generate Actual Results
    - name: Generate Actual Results
      run: python tests/scripts/generate_snapshots.py --path-to-results-dir tests/data/actual --fast-mode

    # Step 4: Pytest E2E Snapshot Assertions
    - name: Run Pytest Comparison
      run: pytest tests/test_e2e.py
